services:
  - type: web
    name: contractflow-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DEMO_MODE
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
